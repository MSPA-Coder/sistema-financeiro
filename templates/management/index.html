{% extends "base.html" %}
{% load icons navegacao %}
{% block title %}Gestão • Painel gerencial{% endblock %}

{% block page_header %}
<div class="top-filter-card">
    <form method="get" class="top-filter-row" hx-get="{{ request.path }}" hx-trigger="change" {% nav_filtro %}>
        <label class="top-filter-field">
            Titular
            <select name="owner_id">
                <option value="">Todos os Titulares</option>
                {% for owner in owners %}
                <option value="{{ owner.id }}" {% if owner.id == current_owner_id %}selected{% endif %}>{{ owner.name }}</option>
                {% endfor %}
            </select>
        </label>
        <label class="top-filter-field">
            Instituição
            <select name="institution_id">
                <option value="">Todas as Instituições</option>
                {% for bank in banks %}
                <option value="{{ bank.id }}" {% if bank.id == current_institution_id %}selected{% endif %}>{{ bank.institution_name }}</option>
                {% endfor %}
            </select>
        </label>
        <label class="top-filter-field">
            Conta
            <select name="account_id">
                <option value="">Todas as Contas</option>
                {% for account in accounts %}
                <option value="{{ account.id }}" {% if account.id == current_account_id %}selected{% endif %}>{{ account.account_name }}</option>
                {% endfor %}
            </select>
        </label>
        <label class="top-filter-field compact">
            Mês
            <input type="month" name="month" value="{{ period_value }}" {% if system_start_date %}min="{{ system_start_date|date:'Y-m' }}"{% endif %}>
        </label>
        <div class="top-filter-actions">
            <a href="{% url 'management:management_view' %}"
               class="btn btn-ghost btn-sm" hx-boost="true" {% nav_filtro %}>{% icon 'x' %}<span>Limpar</span></a>
        </div>
    </form>
</div>
{% endblock %}

{% block content %}
<div id="management-content">
    {% include "management/partials/management_content.html" %}
</div>
{% endblock %}
