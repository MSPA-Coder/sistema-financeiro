{% load static %}
<!DOCTYPE html>
<html lang="pt-BR" data-theme="{{ ui_theme|default:'light' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Fluxo de Caixa{% endblock %}</title>
    <script src="{% static 'js/core/theme-init.js' %}"></script>
    <link rel="icon" href="{% static 'favicon.svg' %}">

    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'sharedauth/sharedauth-ui.css' %}">

    {% comment %}
    Configuracao lida pelo HTMX na inicializacao, ANTES de ele injetar coisa
    alguma. Era feita em `js/core/htmx-config.js`, que rodava depois de
    `htmx.min.js` -- tarde demais: o `<style>` do indicador ja tinha sido
    injetado, sem nonce, e a CSP o bloqueava a cada carga. A classe
    `.htmx-indicator` e estilizada em `core/application.css`, onde o resto da
    aparencia deste projeto mora.

    `attributesToSettle` preserva apenas `class`. `style`, `width` e `height`
    pertencem ao ciclo de vida do canvas: o Chart.js troca os dois ultimos por
    pixels reais do dispositivo. Se o HTMX os copia para o canvas novo, ele
    nasce com a medida do grafico anterior e pode ficar ovalado, menor ou sem
    area para desenhar. Nenhum elemento deste projeto depende desses atributos
    sobreviver a um swap.
    {% endcomment %}
    <meta name="htmx-config" content='{"includeIndicatorStyles": false, "attributesToSettle": ["class"]}'>
    <script src="{% static 'vendor/htmx.min.js' %}"></script>
    <script src="{% static 'sharedauth/sharedauth-ui.js' %}" defer></script>

    {% block styles %}{% endblock %}

</head>
<body data-table-scroll-rows="{{ table_scroll_rows|default:15 }}">
    <div id="ajaxLoadingBar" aria-hidden="true"></div>
    <div class="app-shell">
        {% include 'components/navigation.html' %}
        <div class="app-content">
            {% include 'components/_flash_messages.html' %}

            <header id="appPageHeader" class="app-page-header">
                <div class="app-page-header-inner">
                    {% block page_header %}{% endblock %}
                </div>
            </header>

            <main id="appMain">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
    <script src="{% static 'js/core/application.js' %}"></script>
    <script src="{% static 'vendor/chart.umd.min.js' %}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
