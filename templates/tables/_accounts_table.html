{% load icons %}
<tbody id="accountsTableBody">
{% for account in accounts %}
    <tr>
        <td>{{ account.owner.name }}</td>
        <td>{{ account.institution.institution_name }}</td>
        <td>{{ account.account_name }}</td>
        <td class="amount">{{ account.initial_balance }}</td>
        <td class="actions">
            <button type="button" class="btn btn-sm btn-icon btn-action-edit" title="Editar" data-toggle-edit="edit-account-{{ account.id }}">{% icon 'edit' %}</button>
            <form method="post" action="{% url 'banking:delete_account' account.id %}" data-ui="inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-sm btn-icon btn-action-delete" title="Excluir"
                        data-sa-confirmar="Excluir a conta {{ account.account_name }}? Esta ação não pode ser desfeita."
                        data-sa-titulo="Excluir conta"
                        data-sa-severidade="error"
                        data-sa-ok="Excluir">{% icon 'delete' %}</button>
            </form>
        </td>
    </tr>
    <tr id="edit-account-{{ account.id }}" class="edit-row">
        <td colspan="5">
            <form method="post" action="{% url 'banking:update_account' account.id %}" class="edit-form">
                {% csrf_token %}
                <select name="owner_id" aria-label="Titular" required data-ui="flex-1">
                    {% for owner in owners %}
                        <option value="{{ owner.id }}" {% if owner.id == account.owner_id %}selected{% endif %}>{{ owner.name }}</option>
                    {% endfor %}
                </select>
                <select name="institution_id" aria-label="Instituição" required data-ui="flex-1">
                    {% for institution in institutions %}
                        <option value="{{ institution.id }}" {% if institution.id == account.institution_id %}selected{% endif %}>{{ institution.institution_name }}</option>
                    {% endfor %}
                </select>
                <input type="text" name="account_name" value="{{ account.account_name }}" aria-label="Nome da conta" maxlength="100" required data-ui="flex-1">
                <input type="text" name="initial_balance" value="{{ account.initial_balance }}" aria-label="Saldo inicial" data-ui="w-120">
                <button type="submit" class="btn btn-primary btn-sm">{% icon 'save' %}<span>Salvar</span></button>
            </form>
        </td>
    </tr>
{% empty %}
    <tr>
        <td colspan="5" class="empty-state">Nenhuma conta cadastrada.</td>
    </tr>
{% endfor %}
</tbody>
