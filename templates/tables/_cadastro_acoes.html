{% load icons %}
{# Incluir abre o formulario; aberto, Salvar (envia o formulario) e Cancelar tomam o lugar dele. `chave` distingue um segundo formulario na pagina. #}
<div class="page-header-actions">
    <button type="button" class="btn btn-primary btn-sm" data-cadastro-incluir="{{ chave }}"
            aria-controls="cadastro-novo{% if chave %}-{{ chave }}{% endif %}" aria-expanded="false">{% icon 'plus' %}<span>Incluir</span></button>
    <button type="submit" form="cadastro-form{% if chave %}-{{ chave }}{% endif %}" class="btn btn-primary btn-sm" data-cadastro-salvar="{{ chave }}" hidden
            data-sa-confirmar="{{ confirmar }}"
            data-sa-titulo="Confirmar cadastro"
            data-sa-severidade="info"
            data-sa-ok="Cadastrar">{% icon 'save' %}<span>Salvar</span></button>
    <button type="button" class="btn btn-ghost btn-sm" data-cadastro-cancelar="{{ chave }}" hidden>{% icon 'x' %}<span>Cancelar</span></button>
</div>
