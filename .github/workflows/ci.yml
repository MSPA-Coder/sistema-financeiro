name: CI

on:
  push:
    branches: [main]
  # Sem filtro de `branches`, de proposito: assim a verificacao roda em PR para
  # QUALQUER base, e nao so para `main`.
  #
  # Com o filtro, um PR empilhado sobre outro branch nao disparava check
  # nenhum -- e o sintoma e a ausencia de sinal, nao um vermelho: a pagina do
  # PR fica limpa e parece aprovada. Aconteceu na fase F1.
  #
  # O `push` acima continua restrito a `main`: o que interessa la e o estado
  # do branch que a producao espelha.
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "47 3 * * 2"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualidade
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Criar CA efêmera para o build
        run: |
          mkdir -p .certs
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 \
            -keyout /tmp/local-root-ca.key \
            -out .certs/local-root-ca.crt \
            -subj "/CN=ControleBancario CI Local CA"
          rm -f /tmp/local-root-ca.key
      - name: Criar segredos efêmeros de CI
        # O `chmod 0644` na senha do PostgreSQL não é descuido, e o `umask 077`
        # continua valendo para a chave do Django.
        #
        # Um segredo de arquivo do Compose é montado preservando dono e modo do
        # host -- `uid`, `gid` e `mode` na sintaxe longa são ignorados fora do
        # Swarm, e o próprio Compose avisa isso. O contêiner do PostgreSQL roda
        # como `user: "postgres"` (uid 70) e precisa LER esse arquivo para
        # inicializar; com 0600 pertencendo ao runner (uid 1001), ele morre no
        # arranque com "Permission denied" e o serviço que depende dele nunca
        # sobe.
        #
        # Até a fase F1 isso não aparecia porque nenhum contêiner de banco subia
        # na CI. O valor aqui é uma constante pública deste arquivo e não
        # protege nada.
        #
        # Os três arquivos sem prefixo são somente para o smoke da imagem
        # operacional. A suíte usa outro conjunto, com nomes distintos, para
        # impedir que um teste tenha acesso acidental a um segredo de runtime.
        run: |
          umask 077
          mkdir -p .secrets
          printf '%s\n' 'ci-runtime-django-secret-not-for-production' > .secrets/django_secret_key
          printf '%s\n' 'ci-runtime-postgres-password-not-for-production' > .secrets/postgres_password
          printf '%s\n' 'ci-runtime-postgres-app-password-not-for-production' > .secrets/postgres_app_password
          printf '%s\n' 'ci-runtime-patrimonio-token-not-for-production' > .secrets/patrimonio_token
          printf '%s\n' 'ci-quality-django-secret-not-for-production' > .secrets/quality_django_secret_key
          printf '%s\n' 'ci-quality-postgres-password-not-for-production' > .secrets/quality_postgres_password
          printf '%s\n' 'ci-quality-patrimonio-token-not-for-production' > .secrets/quality_patrimonio_token
          # Compose preserva o modo do arquivo de segredo fora do Swarm. Os
          # valores são sintéticos e precisam ser legíveis pelos usuários dos
          # contêineres web e postgres-teste.
          chmod 0644 .secrets/*
      - name: Validar Compose
        run: docker compose config --quiet
      - name: Construir quality sem cache
        run: docker compose --profile quality build --no-cache quality
      - name: Executar quality
        run: docker compose --profile quality run --rm quality

      - name: Smoke e readiness da imagem operacional
        run: |
          set -euo pipefail
          cleanup() {
            docker compose down --remove-orphans
          }
          trap cleanup EXIT

          # `up --wait` aguarda postgres-teste? Não: aqui o fluxo operacional
          # sobe postgres, migrate e web; o healthcheck de `/health/` só passa
          # depois que migrations terminaram e o PostgreSQL responde.
          docker compose up --build --detach --wait --wait-timeout 120 web
          curl --fail --silent --show-error --max-time 10 \
            http://127.0.0.1:5201/health/ | grep -F '"status": "ok"'

          # O web atende com o papel restrito, e ele não é superusuário. A
          # trava de `core/papel_do_banco.py` já derrubaria o /health; esta
          # consulta confere o outro lado, no próprio servidor.
          papel="$(docker compose exec -T postgres psql -U controle_bancario -d controle_bancario -tAc \
            "select string_agg(distinct a.usename || ':' || r.rolsuper, ',') from pg_stat_activity a join pg_roles r on r.rolname = a.usename where a.datname = current_database() and a.application_name <> 'psql'")"
          echo "conexões da aplicação: $papel"
          test "$papel" = "controle_bancario_app:false"

      # O Dependabot cobre atualizacoes; o pip-audit responde separadamente se
      # a versao instalada tem uma vulnerabilidade conhecida.
      #
      # Roda dentro da propria imagem `quality`, que ja instala exatamente o que
      # a imagem servida instala, mais as ferramentas de teste. Auditar o
      # ambiente instalado responde a pergunta certa; auditar o arquivo de
      # requisitos responderia sobre o que esta ESCRITO, nao sobre o que esta
      # rodando.
      #
      # Reprova em qualquer achado, de proposito. Vulnerabilidade sem correcao
      # publicada sai por `--ignore-vuln ID` com um comentario dizendo por que:
      # cada excecao vira uma decisao explicita e datada, em vez de um vermelho
      # permanente que se aprende a ignorar.
      # `--cache-dir` em /tmp porque HOME e /app na imagem e /app/.cache nao
      # existe: sem isto o pip-audit morre tentando criar o proprio cache,
      # antes de auditar coisa alguma. Mesmo motivo de RUFF_CACHE_DIR e
      # PYTEST_ADDOPTS ja apontarem para /tmp no Dockerfile.
      - name: Auditar dependencias instaladas (CVE conhecido)
        run: docker compose --profile quality run --rm quality pip-audit --progress-spinner=off --cache-dir /tmp/pip-audit-cache
      - name: Construir runtime imutavel
        run: docker compose -f compose.yaml build --no-cache web

      # O `pip-audit` acima cobre as dependencias Python. Esta varredura cobre o
      # que ele nao ve: os pacotes do sistema operacional da imagem base.
      #
      # RODA COMO CONTEINER, NAO COMO ACTION. A politica de Actions deste
      # repositorio e `selected` com apenas `github_owned_allowed` -- action de
      # terceiro e barrada antes de o workflow rodar, e o sintoma e
      # `startup_failure` sem log. Conformar-se a politica e melhor que
      # afrouxa-la para caber uma ferramenta.
      #
      # `docker save` + `--input` em vez de montar /var/run/docker.sock: montar
      # o socket do Docker e dar root na pratica, que foi exatamente o motivo
      # de o `autoheal` ter sido recusado no VPS. Nao vale reabrir aqui.
      #
      # Imagem fixada por digest do indice multi-arquitetura, pelo mesmo motivo
      # que as actions sao fixadas por SHA.
      #
      # `--ignore-unfixed` de proposito: CVE de pacote de sistema sem correcao
      # publicada nao e acionavel. Reprovar por ele travaria PR sem relacao
      # nenhuma com o assunto e ensinaria a ignorar o vermelho.
      - name: Varredura de vulnerabilidade da imagem servida
        run: |
          set -euo pipefail
          docker save controle-bancario:local -o "$RUNNER_TEMP/imagem.tar"
          chmod 644 "$RUNNER_TEMP/imagem.tar"
          # O banco do Trivy tem mais de 100 MiB; 64 MiB fazia a varredura
          # falhar por espaço no tmpfs, não por vulnerabilidade.
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          chmod 777 "$RUNNER_TEMP/trivy-cache"
          docker run --rm \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,size=256m \
            -v "$RUNNER_TEMP:/varredura:ro" \
            -v "$RUNNER_TEMP/trivy-cache:/tmp/trivy-cache:rw" \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            --cache-dir /tmp/trivy-cache \
            image --input /varredura/imagem.tar \
                  --scanners vuln \
                  --severity HIGH,CRITICAL \
                  --ignore-unfixed \
                  --exit-code 1 \
                  --format table
      - name: Verificar fronteira do runtime
        shell: bash
        run: |
          set -euo pipefail
          # `docker compose images -q` lista somente conteineres ja criados;
          # apos `build` ele pode devolver um ID antigo ou inexistente. A
          # configuracao e a fonte do nome da imagem que acabou de ser criada.
          #
          # O nome e fixo por `image:` no Compose e portanto nao varia com o
          # diretorio em que o repositorio foi clonado.
          runtime_image="$(docker compose config --images | grep -x 'controle-bancario:local' | head -1)"
          test -n "$runtime_image"

          docker run --rm \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --tmpfs /workspace/logs:rw,noexec,nosuid,size=16m,uid=999,gid=999,mode=755 \
            --tmpfs /workspace/staticfiles:rw,noexec,nosuid,size=16m,uid=999,gid=999,mode=755 \
            --tmpfs /workspace/media:rw,noexec,nosuid,size=16m,uid=999,gid=999,mode=755 \
            --entrypoint sh "$runtime_image" -ec '
            require_read_only() {
              if test -w "$1"; then
                echo "Caminho de codigo gravavel no runtime: $1" >&2
                exit 1
              fi
            }
            require_writable() {
              if ! test -w "$1"; then
                echo "Diretorio de estado nao gravavel no runtime: $1" >&2
                exit 1
              fi
            }
            require_absent() {
              if command -v "$1" >/dev/null; then
                echo "Ferramenta proibida no runtime: $1" >&2
                exit 1
              fi
            }

            require_read_only /workspace
            require_read_only /workspace/financeiro
            require_writable /workspace/logs
            require_writable /workspace/staticfiles
            require_writable /workspace/media
            require_absent ruff
            require_absent pytest
            require_absent pip-audit
            require_absent curl
            require_absent pg_dump
            require_absent gcc
            # A imagem servida nao contem pip (ver o Dockerfile); a coerencia
            # das dependencias vem garantida pelo `uv.lock`.
          '

          runtime_container="$(docker create "$runtime_image")"
          trap 'docker rm -f "$runtime_container" >/dev/null' EXIT
          if docker export "$runtime_container" | tar -t | grep -E '(^|/)workspace/(\.secrets(/|$)|\.env(\..*)?$|.*\.(key|pem|crt)$)'; then
            echo "Arquivo local, segredo ou dependencia de desenvolvimento encontrado no runtime." >&2
            exit 1
          fi
