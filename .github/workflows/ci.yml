name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "47 3 * * 2"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualidade
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Criar CA efêmera para o build
        run: |
          mkdir -p .certs
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 \
            -keyout /tmp/local-root-ca.key \
            -out .certs/local-root-ca.crt \
            -subj "/CN=ControleBancario CI Local CA"
          rm -f /tmp/local-root-ca.key
      - name: Criar segredos efêmeros de CI
        run: |
          umask 077
          mkdir -p .secrets
          printf '%s\n' 'ci-django-secret-key-not-for-production' > .secrets/django_secret_key
          printf '%s\n' 'ci-postgres-password-not-for-production' > .secrets/postgres_password
      - name: Escrever o token de leitura do SharedAuth
        # PAT de acesso restrito, somente-leitura, só no repositório
        # SharedAuth -- usado apenas para o `pip install` do requirements.txt
        # baixar essa dependência privada durante o build da imagem.
        run: |
          umask 077
          mkdir -p .secrets
          printf '%s' "${{ secrets.SHAREDAUTH_READ_TOKEN }}" > .secrets/github_token.txt
      - name: Validar Compose
        run: docker compose config --quiet
      - name: Construir quality sem cache
        run: docker compose --profile quality build --no-cache quality
      - name: Executar quality
        run: docker compose --profile quality run --rm quality

      # O Dependabot abre PR quando sai versao nova. Nao e a mesma pergunta que
      # "a versao que esta instalada AGORA tem CVE conhecido?" -- e essa segunda
      # ninguem fazia em nenhum dos seis repositorios.
      #
      # Roda dentro da propria imagem `quality`, que ja instala exatamente o que
      # a imagem servida instala, mais as ferramentas de teste. Auditar o
      # ambiente instalado responde a pergunta certa; auditar o arquivo de
      # requisitos responderia sobre o que esta ESCRITO, nao sobre o que esta
      # rodando.
      #
      # Reprova em qualquer achado, de proposito. Vulnerabilidade sem correcao
      # publicada sai por `--ignore-vuln ID` com um comentario dizendo por que:
      # cada excecao vira uma decisao explicita e datada, em vez de um vermelho
      # permanente que se aprende a ignorar.
      - name: Auditar dependencias instaladas (CVE conhecido)
        run: docker compose --profile quality run --rm quality pip-audit --progress-spinner=off
      - name: Construir runtime imutavel
        run: docker compose -f compose.yaml build --no-cache web
      - name: Verificar fronteira do runtime
        shell: bash
        run: |
          set -euo pipefail
          # `docker compose images -q` lista somente contêineres já criados;
          # após `build` ele pode devolver um ID antigo ou inexistente. A
          # configuração é a fonte do nome da imagem que acabou de ser criada.
          runtime_image="$(docker compose config --images | grep -x 'controle-bancario-web')"
          test -n "$runtime_image"

          docker run --rm --entrypoint sh "$runtime_image" -ec '
            require_read_only() {
              if test -w "$1"; then
                echo "Caminho de codigo gravavel no runtime: $1" >&2
                exit 1
              fi
            }
            require_writable() {
              if ! test -w "$1"; then
                echo "Diretorio de estado nao gravavel no runtime: $1" >&2
                exit 1
              fi
            }
            require_absent() {
              if command -v "$1" >/dev/null; then
                echo "Ferramenta proibida no runtime: $1" >&2
                exit 1
              fi
            }

            require_read_only /workspace
            require_read_only /workspace/financeiro
            require_writable /workspace/logs
            require_writable /workspace/staticfiles
            require_writable /workspace/media
            test ! -e /workspace/requirements-dev.txt || {
              echo "requirements-dev.txt encontrado no runtime." >&2
              exit 1
            }
            require_absent curl
            require_absent pg_dump
            require_absent gcc
            python -m pip check
          '

          runtime_container="$(docker create "$runtime_image")"
          trap 'docker rm -f "$runtime_container" >/dev/null' EXIT
          if docker export "$runtime_container" | tar -t | grep -E '(^|/)workspace/(\.secrets(/|$)|\.env(\..*)?$|requirements-dev\.txt$|.*\.(key|pem|crt)$)'; then
            echo "Arquivo local, segredo ou dependencia de desenvolvimento encontrado no runtime." >&2
            exit 1
          fi
