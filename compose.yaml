name: controle-bancario

x-app-build: &app-build
  # Nome fixo em vez do derivado do diretório. Sem isto o Compose batiza a
  # imagem a partir do nome da pasta, que muda conforme onde o repositório foi
  # clonado — no CI seria um nome, no VPS outro. A varredura de vulnerabilidade
  # precisa apontar para uma imagem por NOME, e nome que depende do caminho do
  # checkout não serve de alvo. Entra no âncora para `migrate` e `web`
  # compartilharem a mesma imagem, que é o que já acontecia de fato.
  image: controle-bancario:local
  build:
    context: .
    target: runtime
    secrets:
      - local_ca
      - github_token

x-app-environment: &app-environment
  DJANGO_SETTINGS_MODULE: financeiro.settings
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
  POSTGRES_DB: ${POSTGRES_DB:-controle_bancario}
  DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
  REQUIRE_FILE_SECRETS: "true"
  TZ: America/Sao_Paulo
  PYTHONUNBUFFERED: "1"

x-app-secrets: &app-secrets
  secrets:
    - django_secret_key
    - postgres_password

x-service-logging: &service-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Serviços de aplicação não precisam escrever na camada da imagem. Os únicos
# caminhos persistentes e graváveis são volumes declarados pelo serviço.
x-app-hardening: &app-hardening
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:mode=1777,rw,noexec,nosuid,size=64m

# PostgreSQL grava somente no volume de dados. O entrypoint oficial tambem
# funciona como o usuario da imagem quando PGDATA ja lhe pertence; assim nao
# precisa conservar capabilities no processo do banco.
x-postgres-hardening: &postgres-hardening
  user: "postgres"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:mode=1777,rw,noexec,nosuid,size=64m
    - /var/run/postgresql:mode=1777,rw,noexec,nosuid,size=16m
  pids_limit: 256

services:
  postgres:
    <<: *postgres-hardening
    image: postgres:17-alpine
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 512m
    stop_grace_period: 60s
    logging: *service-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-controle_bancario}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TZ: America/Sao_Paulo
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5202}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-controle_bancario}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Etapa controlada de inicializacao: aplica migrations e materializa os
  # assets com hash no volume que o `web` consome. O `web` so sobe depois que
  # esta etapa termina com sucesso.
  migrate:
    <<: [*app-build, *app-hardening, *app-secrets]
    cpus: 1.0
    mem_limit: 512m
    environment:
      <<: *app-environment
    pids_limit: 128
    stop_grace_period: 30s
    logging: *service-logging
    depends_on:
      postgres:
        condition: service_healthy
    # `--clear` é necessário: sem ele, um asset removido do código continua
    # sendo servido a partir do volume indefinidamente.
    command:
      - sh
      - -c
      - "python manage.py migrate --noinput && python manage.py collectstatic --noinput --clear"
    restart: "no"
    volumes:
      - app_logs:/workspace/logs
      - static_volume:/workspace/staticfiles

  web:
    <<: [*app-build, *app-hardening, *app-secrets]
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 512m
    init: true
    pids_limit: 256
    stop_grace_period: 45s
    logging: *service-logging
    environment:
      <<: *app-environment
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DEBUG: ${DEBUG:-False}
      USE_HTTPS: ${USE_HTTPS:-False}
    ports:
      - "127.0.0.1:${APP_PORT:-5201}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "3", "--threads", "4", "--worker-class", "gthread", "--timeout", "60", "--no-control-socket", "financeiro.wsgi:application"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/health/', headers={'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
      start_interval: 1s
    volumes:
      - app_logs:/workspace/logs
      - static_volume:/workspace/staticfiles
      - media_volume:/workspace/media

  # Ruff e a suíte mínima de segurança. Fica atrás de um perfil para não subir
  # junto com a aplicação: `docker compose --profile quality run --rm quality`.
  quality:
    <<: *app-secrets
    build:
      context: .
      target: quality
      secrets:
        - local_ca
        - github_token
    environment:
      <<: *app-environment
    profiles: ["quality"]
    stop_grace_period: 15s
    logging: *service-logging

volumes:
  postgres_data:
  app_logs:
  static_volume:
  media_volume:

secrets:
  local_ca:
    file: .certs/local-root-ca.crt
  # PAT de acesso restrito (somente-leitura, so no repositorio SharedAuth) --
  # usado apenas durante o build, para o `pip install` do requirements.txt
  # baixar a dependencia Git privada. Nunca vira variavel de ambiente do
  # runtime nem fica na imagem final. Mesmo token ja usado nos tres apps
  # Flask; aqui o pacote entra sem o extra `[flask]`.
  github_token:
    file: ${COMPOSE_SECRETS_DIRECTORY:-.secrets}/github_token.txt
  django_secret_key:
    file: ${COMPOSE_SECRETS_DIRECTORY:-.secrets}/django_secret_key
  postgres_password:
    file: ${COMPOSE_SECRETS_DIRECTORY:-.secrets}/postgres_password
