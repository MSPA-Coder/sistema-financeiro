name: controle-bancario

x-app-build: &app-build
  # Nome fixo em vez do derivado do diretório. Sem isto o Compose batiza a
  # imagem a partir do nome da pasta, que muda conforme onde o repositório foi
  # clonado — no CI seria um nome, no VPS outro. A varredura de vulnerabilidade
  # precisa apontar para uma imagem por NOME, e nome que depende do caminho do
  # checkout não serve de alvo. Entra no âncora para `migrate` e `web`
  # compartilharem a mesma imagem, que é o que já acontecia de fato.
  image: controle-bancario:local
  build:
    context: .
    target: runtime
    secrets:
      - local_ca

x-app-environment: &app-environment
  DJANGO_SETTINGS_MODULE: financeiro.settings
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-controle_bancario}
  POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
  POSTGRES_DB: ${POSTGRES_DB:-controle_bancario}
  DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
  REQUIRE_FILE_SECRETS: "true"
  TZ: America/Sao_Paulo
  PYTHONUNBUFFERED: "1"

x-app-secrets: &app-secrets
  secrets:
    - django_secret_key
    - postgres_password

x-service-logging: &service-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Serviços de aplicação não precisam escrever na camada da imagem. Os únicos
# caminhos persistentes e graváveis são volumes declarados pelo serviço.
x-app-hardening: &app-hardening
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:mode=1777,rw,noexec,nosuid,size=64m

# PostgreSQL grava somente no volume de dados. O entrypoint oficial tambem
# funciona como o usuario da imagem quando PGDATA ja lhe pertence; assim nao
# precisa conservar capabilities no processo do banco.
x-postgres-hardening: &postgres-hardening
  user: "postgres"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:mode=1777,rw,noexec,nosuid,size=64m
    - /var/run/postgresql:mode=1777,rw,noexec,nosuid,size=16m
  pids_limit: 256

services:
  postgres:
    <<: *postgres-hardening
    image: postgres:17-alpine
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 512m
    stop_grace_period: 60s
    logging: *service-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-controle_bancario}
      POSTGRES_USER: ${POSTGRES_USER:-controle_bancario}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TZ: America/Sao_Paulo
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5202}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-controle_bancario} -d ${POSTGRES_DB:-controle_bancario}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Etapa controlada de inicializacao: aplica migrations e materializa os
  # assets com hash no volume que o `web` consome. O `web` so sobe depois que
  # esta etapa termina com sucesso.
  migrate:
    <<: [*app-build, *app-hardening, *app-secrets]
    cpus: 1.0
    mem_limit: 512m
    environment:
      <<: *app-environment
    pids_limit: 128
    stop_grace_period: 30s
    logging: *service-logging
    depends_on:
      postgres:
        condition: service_healthy
    # `--clear` é necessário: sem ele, um asset removido do código continua
    # sendo servido a partir do volume indefinidamente.
    command:
      - sh
      - -c
      - "python manage.py migrate --noinput && python manage.py collectstatic --noinput --clear"
    restart: "no"
    volumes:
      - app_logs:/workspace/logs
      - static_volume:/workspace/staticfiles

  web:
    <<: [*app-build, *app-hardening, *app-secrets]
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 512m
    init: true
    pids_limit: 256
    stop_grace_period: 45s
    logging: *service-logging
    environment:
      <<: *app-environment
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DEBUG: ${DEBUG:-False}
      USE_HTTPS: ${USE_HTTPS:-False}
      AUDIT_TRUSTED_PROXY_CIDRS: ${AUDIT_TRUSTED_PROXY_CIDRS:-}
    ports:
      - "127.0.0.1:${APP_PORT:-5201}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "3", "--threads", "4", "--worker-class", "gthread", "--timeout", "60", "--no-control-socket", "financeiro.wsgi:application"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/health/', headers={'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
      start_interval: 1s
    volumes:
      - app_logs:/workspace/logs
      - static_volume:/workspace/staticfiles
      - media_volume:/workspace/media

  # Ruff e a suíte mínima de segurança. Fica atrás de um perfil para não subir
  # junto com a aplicação:
  # `docker compose --profile quality run --build --rm quality`.
  # O `--build` é necessário: este serviço não monta o código do host, e
  # `docker compose run` reutiliza a imagem existente sem reconstruí-la.
  # Banco EFÊMERO da suíte.
  #
  # Não é o `postgres` de cima, e isso é deliberado: a suíte não pode ter
  # caminho até o volume com dados reais, nem por engano. O runner do Django
  # cria e destrói `test_controle_bancario` sozinho, mas ele faz isso NO
  # SERVIDOR que a configuração apontar -- e um `DROP DATABASE` sempre executa
  # onde mandaram, não onde era seguro.
  #
  # Sem volume nomeado: os dados vivem em tmpfs e somem com o contêiner. Além
  # de fechar a porta acima, deixa a suíte mais rápida, porque nada toca disco.
  postgres-teste:
    <<: *postgres-hardening
    image: postgres:17-alpine
    profiles: ["quality"]
    cpus: 1.0
    mem_limit: 512m
    logging: *service-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-controle_bancario}
      POSTGRES_USER: ${POSTGRES_USER:-controle_bancario}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TZ: America/Sao_Paulo
    # O arquivo precisa ser LEGÍVEL PELO UID 70 (o `postgres` da imagem). Um
    # segredo de arquivo é montado preservando dono e modo do host, e `uid`,
    # `gid` e `mode` na sintaxe longa são ignorados fora do Swarm -- o Compose
    # até avisa. Com `.secrets/postgres_password` em 0600 de outro dono, este
    # contêiner morre no arranque com "Permission denied" e o `quality` reporta
    # apenas "dependency failed to start". No Docker Desktop do Windows o
    # problema não aparece, porque lá todo arquivo montado chega como 0777.
    secrets:
      - postgres_password
    # Sem `ports`: ninguém de fora precisa alcançá-lo, e não publicar é uma
    # porta a menos escutando na máquina de quem roda a suíte.
    #
    # Este `tmpfs` SUBSTITUI o do anchor `postgres-hardening` -- o merge do YAML
    # troca a chave inteira, não acrescenta itens. Por isso os dois caminhos do
    # anchor estão repetidos aqui: sem eles, um Postgres com `read_only: true`
    # não consegue escrever o socket nem os arquivos temporários, e nem sobe.
    # `uid=70,gid=70,mode=0700` porque um tmpfs nasce pertencendo ao root, e o
    # `initdb` roda como `postgres` com `cap_drop: ALL` -- sem CAP_CHOWN e
    # CAP_FOWNER ele não consegue tomar posse do diretório, e o contêiner morre
    # em "could not change permissions". 70 é o uid do postgres nesta imagem.
    # O `0700` é o modo que o próprio `initdb` exigiria de qualquer forma.
    tmpfs:
      - /tmp:mode=1777,rw,noexec,nosuid,size=64m
      - /var/run/postgresql:mode=1777,rw,noexec,nosuid,size=16m
      - /var/lib/postgresql/data:mode=0700,uid=70,gid=70,rw,size=512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-controle_bancario} -d ${POSTGRES_DB:-controle_bancario}"]
      interval: 3s
      timeout: 5s
      retries: 20

  quality:
    <<: *app-secrets
    build:
      context: .
      target: quality
      secrets:
        - local_ca
    environment:
      <<: *app-environment
      # Sobrescreve o `postgres` da âncora. A suíte fala com o banco efêmero.
      POSTGRES_HOST: postgres-teste
    depends_on:
      postgres-teste:
        condition: service_healthy
    profiles: ["quality"]
    stop_grace_period: 15s
    logging: *service-logging

volumes:
  postgres_data:
  app_logs:
  static_volume:
  media_volume:

secrets:
  local_ca:
    file: .certs/local-root-ca.crt
  django_secret_key:
    file: ${COMPOSE_SECRETS_DIRECTORY:-.secrets}/django_secret_key
  postgres_password:
    file: ${COMPOSE_SECRETS_DIRECTORY:-.secrets}/postgres_password
