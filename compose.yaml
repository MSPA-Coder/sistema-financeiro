name: controle-bancario

x-app-build: &app-build
  # Nome fixo em vez do derivado do diretório. Sem isto o Compose batiza a
  # imagem a partir do nome da pasta, que muda conforme onde o repositório foi
  # clonado — no CI seria um nome, no VPS outro. A varredura de vulnerabilidade
  # precisa apontar para uma imagem por NOME, e nome que depende do caminho do
  # checkout não serve de alvo. Entra no âncora para `migrate` e `web`
  # compartilharem a mesma imagem, que é o que já acontecia de fato.
  image: controle-bancario:local
  build:
    context: .
    target: runtime
    secrets:
      - local_ca

# O runtime conecta com o papel restrito (só DML), provisionado pelo serviço
# `db-provision`. O papel administrativo `POSTGRES_USER` -- superusuário, dono
# das tabelas -- só aparece no `postgres`, no `db-provision` e no `migrate`.
# `DB_EXIGIR_PAPEL_RESTRITO` faz a aplicação recusar uma conexão superusuária
# (ver `core/papel_do_banco.py`).
x-app-environment: &app-environment
  DJANGO_SETTINGS_MODULE: financeiro.settings
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_APP_USER:-controle_bancario_app}
  POSTGRES_PASSWORD_FILE: /run/secrets/postgres_app_password
  DB_EXIGIR_PAPEL_RESTRITO: "1"
  POSTGRES_DB: ${POSTGRES_DB:-controle_bancario}
  DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
  # Token da rota /patrimonio/v1/resumo, lida pelo consolidador. A integração é
  # opcional: sem um token utilizável a rota responde 503 e nada mais muda.
  PATRIMONIO_TOKEN_FILE: /run/secrets/patrimonio_token
  REQUIRE_FILE_SECRETS: "true"
  TZ: America/Sao_Paulo
  PYTHONUNBUFFERED: "1"

x-app-secrets: &app-secrets
  secrets:
    - django_secret_key
    - postgres_app_password
    - patrimonio_token

# A suíte nunca precisa ler os arquivos usados pelos serviços operacionais.
# Além de tornar o isolamento explícito, isso evita que uma execução local da
# quality valide por acidente um segredo real montado no mesmo caminho.
x-quality-environment: &quality-environment
  DJANGO_SETTINGS_MODULE: financeiro.settings
  POSTGRES_HOST: postgres-teste
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-controle_bancario}
  POSTGRES_PASSWORD_FILE: /run/secrets/quality_postgres_password
  POSTGRES_DB: ${POSTGRES_DB:-controle_bancario}
  DJANGO_SECRET_KEY_FILE: /run/secrets/quality_django_secret_key
  PATRIMONIO_TOKEN_FILE: /run/secrets/quality_patrimonio_token
  REQUIRE_FILE_SECRETS: "true"
  TZ: America/Sao_Paulo
  PYTHONUNBUFFERED: "1"

x-quality-secrets: &quality-secrets
  secrets:
    - quality_django_secret_key
    - quality_postgres_password
    - quality_patrimonio_token

# O portão roda em um contêiner descartável, mas ainda deve ter a mesma
# fronteira de privilégio do runtime. /tmp e logs são os únicos destinos que
# precisam continuar graváveis durante os testes.
x-quality-hardening: &quality-hardening
  user: "65532:65532"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:mode=1777,rw,noexec,nosuid,size=64m
    - /workspace/logs:mode=1777,rw,noexec,nosuid,size=16m
  pids_limit: 256

x-service-logging: &service-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Serviços de aplicação não precisam escrever na camada da imagem. Os únicos
# caminhos persistentes e graváveis são volumes declarados pelo serviço.
x-app-hardening: &app-hardening
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:mode=1777,rw,noexec,nosuid,size=64m

# PostgreSQL grava somente no volume de dados. O entrypoint oficial tambem
# funciona como o usuario da imagem quando PGDATA ja lhe pertence; assim nao
# precisa conservar capabilities no processo do banco.
x-postgres-hardening: &postgres-hardening
  user: "postgres"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:mode=1777,rw,noexec,nosuid,size=64m
    - /var/run/postgresql:mode=1777,rw,noexec,nosuid,size=16m
  pids_limit: 256

services:
  postgres:
    <<: *postgres-hardening
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 512m
    stop_grace_period: 60s
    logging: *service-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-controle_bancario}
      POSTGRES_USER: ${POSTGRES_USER:-controle_bancario}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TZ: America/Sao_Paulo
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5202}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-controle_bancario} -d ${POSTGRES_DB:-controle_bancario}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Cria ou atualiza, de forma idempotente, o papel restrito da aplicação. Roda
  # a cada `up`, antes do `migrate`: numa instalação existente, concede acesso
  # às tabelas que já existem; nas novas, os privilégios padrão cobrem o que o
  # `migrate` criar depois. `DB_APP_MAINTAIN` libera o VACUUM ANALYZE da tela
  # Configurações > Banco de dados.
  db-provision:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    user: postgres
    read_only: true
    cpus: 0.5
    mem_limit: 256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,rw,nosuid,nodev,noexec,size=16m
      - /var/run/postgresql:mode=1777,rw,nosuid,nodev,noexec,size=16m
    pids_limit: 64
    logging: *service-logging
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-controle_bancario}
      DB_ADMIN_USER: ${POSTGRES_USER:-controle_bancario}
      DB_ADMIN_PASSWORD_FILE: /run/secrets/postgres_password
      DB_APP_USER: ${POSTGRES_APP_USER:-controle_bancario_app}
      DB_APP_PASSWORD_FILE: /run/secrets/postgres_app_password
      DB_APP_MAINTAIN: "1"
    secrets:
      - postgres_password
      - postgres_app_password
    volumes:
      - ./scripts/provision-db-runtime.sh:/usr/local/bin/provision-db-runtime.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "/usr/local/bin/provision-db-runtime.sh"]
    restart: "no"

  # Etapa controlada de inicializacao: aplica migrations e materializa os
  # assets com hash no volume que o `web` consome. O `web` so sobe depois que
  # esta etapa termina com sucesso. É o único serviço de aplicação com a
  # credencial administrativa: migration é DDL.
  migrate:
    <<: [*app-build, *app-hardening]
    cpus: 1.0
    mem_limit: 512m
    environment:
      <<: *app-environment
      POSTGRES_USER: ${POSTGRES_USER:-controle_bancario}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      DB_EXIGIR_PAPEL_RESTRITO: "0"
    secrets:
      - django_secret_key
      - postgres_password
      - patrimonio_token
    pids_limit: 128
    stop_grace_period: 30s
    logging: *service-logging
    depends_on:
      postgres:
        condition: service_healthy
      db-provision:
        condition: service_completed_successfully
    # `--clear` é necessário: sem ele, um asset removido do código continua
    # sendo servido a partir do volume indefinidamente.
    command:
      - sh
      - -c
      - "python manage.py migrate --noinput && python manage.py collectstatic --noinput --clear"
    restart: "no"
    volumes:
      - app_logs:/workspace/logs
      - static_volume:/workspace/staticfiles

  web:
    <<: [*app-build, *app-hardening, *app-secrets]
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 512m
    init: true
    pids_limit: 256
    stop_grace_period: 45s
    logging: *service-logging
    environment:
      <<: *app-environment
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DEBUG: ${DEBUG:-False}
      USE_HTTPS: ${USE_HTTPS:-False}
      AUDIT_TRUSTED_PROXY_CIDRS: ${AUDIT_TRUSTED_PROXY_CIDRS:-}
    ports:
      - "127.0.0.1:${APP_PORT:-5201}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "3", "--threads", "4", "--worker-class", "gthread", "--timeout", "60", "--no-control-socket", "financeiro.wsgi:application"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/health/', headers={'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
      start_interval: 1s
    volumes:
      - app_logs:/workspace/logs
      - static_volume:/workspace/staticfiles
      - media_volume:/workspace/media

  # Ruff e a suíte mínima de segurança. Fica atrás de um perfil para não subir
  # junto com a aplicação:
  # `docker compose --profile quality run --build --rm quality`.
  # O `--build` é necessário: este serviço não monta o código do host, e
  # `docker compose run` reutiliza a imagem existente sem reconstruí-la.
  # Banco EFÊMERO da suíte.
  #
  # Não é o `postgres` de cima, e isso é deliberado: a suíte não pode ter
  # caminho até o volume com dados reais, nem por engano. O runner do Django
  # cria e destrói `test_controle_bancario` sozinho, mas ele faz isso NO
  # SERVIDOR que a configuração apontar -- e um `DROP DATABASE` sempre executa
  # onde mandaram, não onde era seguro.
  #
  # Sem volume nomeado: os dados vivem em tmpfs e somem com o contêiner. Além
  # de fechar a porta acima, deixa a suíte mais rápida, porque nada toca disco.
  postgres-teste:
    <<: [*postgres-hardening, *quality-secrets]
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    profiles: ["quality"]
    cpus: 1.0
    mem_limit: 512m
    logging: *service-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-controle_bancario}
      POSTGRES_USER: ${POSTGRES_USER:-controle_bancario}
      POSTGRES_PASSWORD_FILE: /run/secrets/quality_postgres_password
      TZ: America/Sao_Paulo
    # O arquivo precisa ser LEGÍVEL PELO UID 70 (o `postgres` da imagem). Um
    # segredo de arquivo é montado preservando dono e modo do host, e `uid`,
    # `gid` e `mode` na sintaxe longa são ignorados fora do Swarm -- o Compose
    # até avisa. Com `.secrets/quality_postgres_password` em 0600 de outro dono, este
    # contêiner morre no arranque com "Permission denied" e o `quality` reporta
    # apenas "dependency failed to start". No Docker Desktop do Windows o
    # problema não aparece, porque lá todo arquivo montado chega como 0777.
    secrets:
      - quality_postgres_password
    # Sem `ports`: ninguém de fora precisa alcançá-lo, e não publicar é uma
    # porta a menos escutando na máquina de quem roda a suíte.
    #
    # Este `tmpfs` SUBSTITUI o do anchor `postgres-hardening` -- o merge do YAML
    # troca a chave inteira, não acrescenta itens. Por isso os dois caminhos do
    # anchor estão repetidos aqui: sem eles, um Postgres com `read_only: true`
    # não consegue escrever o socket nem os arquivos temporários, e nem sobe.
    # `uid=70,gid=70,mode=0700` porque um tmpfs nasce pertencendo ao root, e o
    # `initdb` roda como `postgres` com `cap_drop: ALL` -- sem CAP_CHOWN e
    # CAP_FOWNER ele não consegue tomar posse do diretório, e o contêiner morre
    # em "could not change permissions". 70 é o uid do postgres nesta imagem.
    # O `0700` é o modo que o próprio `initdb` exigiria de qualquer forma.
    tmpfs:
      - /tmp:mode=1777,rw,noexec,nosuid,size=64m
      - /var/run/postgresql:mode=1777,rw,noexec,nosuid,size=16m
      - /var/lib/postgresql/data:mode=0700,uid=70,gid=70,rw,size=512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-controle_bancario} -d ${POSTGRES_DB:-controle_bancario}"]
      interval: 3s
      timeout: 5s
      retries: 20

  quality:
    <<: [*quality-hardening, *quality-secrets]
    build:
      context: .
      target: quality
      secrets:
        - local_ca
    environment:
      <<: *quality-environment
    depends_on:
      postgres-teste:
        condition: service_healthy
    profiles: ["quality"]
    stop_grace_period: 15s
    logging: *service-logging

volumes:
  postgres_data:
  app_logs:
  static_volume:
  media_volume:

secrets:
  local_ca:
    file: .certs/local-root-ca.crt
  django_secret_key:
    file: ${COMPOSE_SECRETS_DIRECTORY:-.secrets}/django_secret_key
  postgres_password:
    file: ${COMPOSE_SECRETS_DIRECTORY:-.secrets}/postgres_password
  # Senha do papel restrito da aplicação. Precisa ser legível pelo uid 70 (o
  # `db-provision` roda como `postgres`) e pelo usuário do `web`.
  postgres_app_password:
    file: ${COMPOSE_SECRETS_DIRECTORY:-.secrets}/postgres_app_password
  # Gerado por `provision_compose_secrets.ps1` junto com os outros dois. O
  # arquivo precisa existir para o Compose subir, mas o conteúdo só importa
  # para quem usa a integração de patrimônio.
  patrimonio_token:
    file: ${COMPOSE_SECRETS_DIRECTORY:-.secrets}/patrimonio_token
  quality_django_secret_key:
    file: ${COMPOSE_SECRETS_DIRECTORY:-.secrets}/quality_django_secret_key
  quality_postgres_password:
    file: ${COMPOSE_SECRETS_DIRECTORY:-.secrets}/quality_postgres_password
  quality_patrimonio_token:
    file: ${COMPOSE_SECRETS_DIRECTORY:-.secrets}/quality_patrimonio_token
